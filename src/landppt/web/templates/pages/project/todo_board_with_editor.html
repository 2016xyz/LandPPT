<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared/notify.css">
    <link rel="stylesheet" href="/static/css/shared/unattended_monitor.css">
    <script src="/static/js/shared/notify.js?v=20260726"></script>
    <script src="/static/js/shared/unattended_monitor.js?v=20260727"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <style>
{% include "components/project/todo_board_with_editor/style_1.html" %}
    </style>
    <link rel="stylesheet" href="/static/css/generator-workspace.css?v=20260929-compact">
    <link rel="stylesheet" href="/static/css/shared/ui.css?v=20261002-system">
</head>

<body class="landppt-generator">
{% include "components/project/todo_board_with_editor/body_1.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/xml-fold.min.js"></script>
    <script>
{% include "components/project/todo_board_with_editor/script_1.html" %}
    </script>
    <script>
        window.UnattendedMonitor?.mount({
            container: 'unattendedMonitor',
            projectId: {{ project.project_id | tojson }},
            initiallyActive: {{ 'true' if unattended_active else 'false' }},
            // Reload on every terminal status so the workspace regains its own
            // controls; give failures long enough for the toast to be read first.
            onComplete: (run) => setTimeout(
                () => window.location.reload(),
                run.task_status === 'completed' ? 1500 : 6000
            ),
        });
    </script>
</body>

</html>
