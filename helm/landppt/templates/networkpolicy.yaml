{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "landppt.fullname" . }}
  labels:
    {{- include "landppt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "landppt.selectorLabels" . | nindent 6 }}
    # NetworkPolicy allows are additive; never let this policy open renderer egress.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [pptx-renderer]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        {{- if .Values.postgresql.enabled }}
        - protocol: TCP
          port: 5432
        {{- end }}
        {{- if .Values.valkey.enabled }}
        - protocol: TCP
          port: 6379
        {{- end }}
        {{- if .Values.minio.enabled }}
        - protocol: TCP
          port: 9000
        {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
{{- end }}
